name: deploy-notes

# Trigger on pushes to main (production) or manually via the Actions tab
on:
  push:
    branches:
      - main
  workflow_dispatch:

# This job installs dependencies, builds the book, and deploys to gh-pages
# which is served at https://math.suryaraj.com via the CNAME record.
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Upgrade pip
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Build the static HTML site with JupyterBook v2 (MyST engine).
      # Must run from inside the notes/ directory; --html produces a fully
      # static site in _build/html/; --ci suppresses interactive prompts.
      - name: Build the book
        run: |
          cd notes
          jupyter-book build --html --ci

      # Fail fast: ensure the build actually produced HTML before deploying.
      - name: Verify build output exists
        run: |
          if [ ! -f "./notes/_build/html/index.html" ]; then
            echo "ERROR: Build output missing — notes/_build/html/index.html not found"
            exit 1
          fi
          echo "Build output verified. Files:"
          ls ./notes/_build/html/

      # Deploy built HTML + CNAME to the gh-pages branch.
      # peaceiris/actions-gh-pages writes the CNAME file automatically so
      # the custom domain math.suryaraj.com is never lost between deployments.
      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./notes/_build/html
          cname: math.suryaraj.com
          force_orphan: true
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
