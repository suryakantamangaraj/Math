name: Bug Report
description: Report an error, typo, or broken content
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please fill out the details below.

  - type: input
    id: page
    attributes:
      label: Page or Section
      description: Which page or section has the issue?
      placeholder: e.g., Linear Algebra, Fourier Series
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem — wrong formula, broken link, rendering issue, etc.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should the correct content or behavior be?

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Attach any screenshots if applicable.
